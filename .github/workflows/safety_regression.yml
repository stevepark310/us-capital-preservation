name: Safety Regression (No Orders)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUBE_CLOUD_DRY_RUN: "1"
      # Never provide NH secrets to the unit-test workflow.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Syntax checks
        run: python -m compileall -q core execution scripts tests
      - name: Unit and regression tests
        run: python -m pytest -q
      - name: Performance feedback CLI smoke (no orders)
        run: python scripts/agent_performance.py
      - name: Quant monitor CLI smoke (no orders)
        run: python scripts/quant_monitor.py
